; PHP-FPM (Apache ou LiteSpeed) : réglages lus dans la racine web. Ajuster les tailles d'envoi aux besoins réels du projet.
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
; Envoi d'une vidéo (64 Mo au plus, App\Core\Upload::MAX_VIDEO) ou de plusieurs photos de la galerie à la fois.
upload_max_filesize = 64M
post_max_size = 200M
max_file_uploads = 40
