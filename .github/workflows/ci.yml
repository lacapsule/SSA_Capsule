# Intégration continue d'un projet sur le socle PHP (modules/tests-et-ci-php) : à chaque envoi et chaque demande de fusion,
# syntaxe, tests et contrôles qualité avec PHP 8.4 (version retenue par le projet, décision du 2026-11-13).
#
# Pas de déploiement automatique, volontairement : la mise en ligne reste un geste humain (sauvegarde, paquet,
# migrations, doctor) et ne confie aucun accès au serveur à la plateforme de CI.
# Sécurité : jeton en lecture seule, identifiants git non conservés, action de récupération épinglée par SHA
# (mettre à jour le SHA ET le commentaire de version ensemble), image PHP officielle plutôt qu'une action tierce.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Syntaxe, tests et contrôles (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Version et extensions
        run: |
          php -v
          for e in pdo_sqlite sodium mbstring json fileinfo zlib; do
            php -m | grep -qix "$e" || { echo "Extension manquante : $e"; exit 1; }
          done

      - name: Syntaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Tests
        run: php tests/run.php
        env:
          NO_COLOR: '1'

      - name: Contrôles (motifs, fichiers de sécurité, contraste AA)
        run: php scripts/controles.php
        env:
          NO_COLOR: '1'
